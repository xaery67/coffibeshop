name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@coffibeshop/api --if-present

      - name: Test
        run: npm run test --if-present
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Build
        run: npm run build --if-present
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

  # ── GATE #1: migration drift & index pg_trgm (issue #17, PRIORITAS) ──────
  # Bug nyata: folder migration drift menghapus 2 index pg_trgm di SETIAP
  # deployment baru dan tak terdeteksi CI. Job ini mereproduksi deployment
  # dari nol & GAGAL kalau index hilang atau schema drift.
  migration-drift:
    name: Migration drift & pg_trgm gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Migration drift & pg_trgm gate
        run: bash scripts/ci-migration-check.sh

  # ── GATE #2: coverage report (api & web) — artifact + step summary ───────
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build shared
        run: npm run build --workspace=@coffibeshop/shared

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@coffibeshop/api --if-present

      - name: Coverage — API
        run: npm run test --workspace=@coffibeshop/api -- --coverage

      - name: Coverage — Web
        run: npm run test --workspace=@coffibeshop/web -- --coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage/
            apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### 📊 Coverage (issue #17)";
            echo "";
            echo "| Workspace | Laporan |";
            echo "|-----------|---------|";
            echo "| API | \`apps/api/coverage/lcov.info\` |";
            echo "| Web | \`apps/web/coverage/lcov.info\` |";
            echo "";
            echo "Artifact: **coverage** (retensi 14 hari).";
          } >> "$GITHUB_STEP_SUMMARY"

  # ── GATE #3: security scan (Trivy) — image api/web + filesystem, fail-on-high
  docker-scan:
    name: Docker build & Trivy scan
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: coffibeshop/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: coffibeshop/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catatan: memakai image resmi aquasec/trivy via `docker run` (bukan
      # aquasecurity/trivy-action) agar tidak bergantung pada wrapper action yang
      # versinya bisa hilang. Gate tetap fail-on-high (exit-code 1).
      - name: Trivy scan (API image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/tmp/.trivyignore:ro" \
            aquasec/trivy:latest image --quiet \
              --ignorefile /tmp/.trivyignore \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
              coffibeshop/api:ci

      - name: Trivy scan (Web image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/tmp/.trivyignore:ro" \
            aquasec/trivy:latest image --quiet \
              --ignorefile /tmp/.trivyignore \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
              coffibeshop/web:ci

      - name: Trivy scan (filesystem / dependencies)
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/.trivyignore:/tmp/.trivyignore:ro" \
            -w /src aquasec/trivy:latest fs --quiet \
              --ignorefile /tmp/.trivyignore \
              --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln \
              --exit-code 1 .
