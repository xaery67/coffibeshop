name: CD - Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check registry secrets
        id: check
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Registry secrets belum dikonfigurasi - deploy dilewati"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.configured == 'true'

      - name: Log in to registry
        if: steps.check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/coffibeshop-api:${{ github.sha }}

      - name: Build and push Web
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/coffibeshop-web:${{ github.sha }}

      - name: Deploy placeholder
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "TODO - kubectl set image / helm upgrade"
          echo "Lihat docs/PRD-BACKEND-DEVOPS.md section 3"
