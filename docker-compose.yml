# CoffeeShop Online — stack pengembangan lokal
# Jalankan: docker compose up -d --build
#   API  → http://localhost:4000/health
#   Web  → http://localhost:5173
# Produksi memakai Supabase + Upstash (lihat .env.example); Postgres/Redis
# di bawah HANYA untuk dev lokal.

services:
  postgres:
    image: postgres:16-alpine
    container_name: coffibeshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffibeshop
      POSTGRES_PASSWORD: coffibeshop
      POSTGRES_DB: coffibeshop
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffibeshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coffibeshop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: coffibeshop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_BASE_URL: http://localhost:4000
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://coffibeshop:coffibeshop@postgres:5432/coffibeshop
      DIRECT_URL: postgresql://coffibeshop:coffibeshop@postgres:5432/coffibeshop
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: coffibeshop-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pg_data:
  redis_data:
