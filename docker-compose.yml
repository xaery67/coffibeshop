# CoffeeShop Online — stack pengembangan lokal
# Jalankan: docker compose up -d --build
#   API  → http://localhost:4000/health
#   Web  → http://localhost:5173
# Produksi memakai Supabase + Upstash (lihat .env.example); Postgres/Redis
# di bawah HANYA untuk dev lokal.

services:
  postgres:
    image: postgres:16-alpine
    container_name: coffibeshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffibeshop
      POSTGRES_PASSWORD: coffibeshop
      POSTGRES_DB: coffibeshop
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffibeshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coffibeshop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: coffibeshop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_BASE_URL: http://localhost:4000
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://coffibeshop:coffibeshop@postgres:5432/coffibeshop
      DIRECT_URL: postgresql://coffibeshop:coffibeshop@postgres:5432/coffibeshop
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem

      # ── Pass-through dari .env (root) — nilai diambil saat `docker compose up` ──
      # Hanya variabel yang aman & sudah nyata yang diteruskan. Placeholder
      # Supabase/Upstash (<...>) SENGAJA belum diteruskan: nilainya akan
      # menggagalkan validasi URL di apps/api/src/config/env.ts saat boot.
      # Payment — Midtrans sandbox (issue #7)
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      # Business config (dapat di-override lewat .env)
      TAX_RATE: ${TAX_RATE:-0.11}
      POINT_VALUE: ${POINT_VALUE:-1}
      CURRENCY: ${CURRENCY:-IDR}
      SHIPPING_FLAT_FEE: ${SHIPPING_FLAT_FEE:-10000}
    ports:
      - "4000:4000"
    volumes:
      # Kunci JWT di-mount read-only (tidak dibake ke image) — SETUP.md §3.4
      - ./apps/api/.keys:/keys:ro
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: coffibeshop-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pg_data:
  redis_data:
